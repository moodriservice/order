<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暮日計時</title>

<meta name="theme-color" content="#dd5434">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="暮日計時">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../logo-circle.jpg">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
/* 這頁刻意鎖定單一視覺（暮日品牌的暖色日光感），不跟手機深色模式變動：
   廚房裡看到的顏色每次都一樣，才不會在濕手時按錯顏色。
   不載任何外部字型或函式庫——沒訊號也要能立刻開，是硬需求。 */
:root{
  color-scheme: light;
  --brand:#dd5434;
  --brand-dark:#b8401f;
  --bg1:#fffaf7;
  --bg2:#fff3ed;
  --ink:#2b2320;
  --muted:#8a7a73;
  --line:rgba(0,0,0,.08);
  --card:#fff;
  --ok:#2e7d32;
  --wait:#c98a00;
  --void:#9aa0a6;
  --shell:#2b2320;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:linear-gradient(to bottom,var(--bg1),var(--bg2));
  background-attachment:fixed;
  min-height:100vh;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
button{font-family:var(--font);cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none !important}

.tm-phone{max-width:430px;margin:0 auto;padding:0 12px calc(48px + env(safe-area-inset-bottom))}

/* ---------- 頂端常駐列 ---------- */
.tm-topbar{
  position:sticky;top:0;z-index:20;margin:0 -12px 10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(255,250,247,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.tm-brandmark{font-weight:800;font-size:16px;color:var(--brand);letter-spacing:.5px;white-space:nowrap}
.tm-pending{
  margin-left:auto;font-size:13px;color:var(--wait);font-weight:700;
  display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;
  background:none;border:0;padding:8px 4px;min-height:40px;white-space:nowrap;
}
.tm-pending i{width:8px;height:8px;border-radius:50%;background:var(--wait);display:block;flex:0 0 auto}
.tm-pending.clean{color:var(--ok)}
.tm-pending.clean i{background:var(--ok)}
.tm-pending.bad{color:#b3261e}
.tm-pending.bad i{background:#b3261e}
.tm-sync{
  font-size:13px;font-weight:700;padding:9px 14px;
  border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);
  min-height:40px;white-space:nowrap;
}
.tm-sync[disabled]{opacity:.5}
.tm-offline{
  margin:0 -12px 10px;padding:8px 14px;background:#fdf0e6;border-bottom:1px solid var(--line);
  font-size:12.5px;line-height:1.5;color:var(--brand-dark);
}
/* 本機預覽卻接著正式試算表時的警告。刻意做得比離線提示醒目——
   離線只是等一下再送，這個是「現在按下去會真的寫進正式資料」。 */
.tm-warn{
  margin:0 -12px 10px;padding:10px 14px;background:#7a1f12;color:#fff;
  font-size:12.5px;line-height:1.6;
}
.tm-warn strong{color:#ffd9cf}

/* ---------- 頁籤 ---------- */
.tm-tabs{display:flex;gap:8px;margin-bottom:12px}
.tm-tabs button{
  flex:1;font-size:16px;font-weight:700;padding:13px 0;
  border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--muted);min-height:50px;
}
.tm-tabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.tm-sectitle{font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 8px;letter-spacing:.4px}
.tm-empty{margin:8px 2px;font-size:13px;line-height:1.7;color:var(--muted)}

/* ---------- 今日小結：像廚房工作檯上的一張小記錄卡 ---------- */
.tm-daily{
  margin:0 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;
  background:rgba(255,255,255,.82);box-shadow:0 2px 8px rgba(0,0,0,.035);
}
.tm-dailyhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tm-daily h2{margin:0;font-size:15px;font-weight:800}
.tm-daily .tm-dailycount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tm-daily .tm-dailytime{margin:7px 0 0;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.tm-daily .tm-dailyitems{margin:5px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.tm-daily .tm-dailynote{margin:6px 0 0;font-size:11.5px;line-height:1.5;color:var(--muted)}

/* 跨日／待填數量不是錯誤，只要在開頁時讓人看見、自己確認即可。 */
.tm-carry{
  margin:0 0 12px;padding:11px 14px;border-left:4px solid var(--brand);border-radius:0 14px 14px 0;
  background:#fff0ea;color:var(--ink);
}
.tm-carry h2{margin:0;font-size:14px;font-weight:800}
.tm-carry p{margin:4px 0 0;font-size:12.5px;line-height:1.55;color:#754234}
.tm-carrylist{display:grid;gap:6px;margin-top:9px}
.tm-carryrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name action" "meta action";gap:2px 8px;align-items:center;font-size:13px;line-height:1.4}
.tm-carryrow .name{grid-area:name;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-carryrow .meta{grid-area:meta;color:#754234;font-variant-numeric:tabular-nums}
.tm-carryrow button{grid-area:action;min-height:36px;padding:7px 10px;border:1px solid rgba(184,64,31,.3);border-radius:10px;background:#fff;color:var(--brand-dark);font-size:12px;font-weight:700}

/* ---------- 品項列 ---------- */
.tm-items{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tm-items::-webkit-scrollbar{display:none}
.tm-items button{
  flex:0 0 auto;font-size:16px;font-weight:700;
  padding:0 18px;height:56px;border-radius:16px;
  border:1.5px solid var(--brand);background:#fff;color:var(--brand);
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tm-items button.add{border-style:dashed;border-color:var(--muted);color:var(--muted)}

/* ---------- 卡片（草案 C：時間軸列） ---------- */
.tm-cards{display:grid;gap:12px;grid-template-columns:1fr}
.tm-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
  display:grid;grid-template-columns:1fr 128px;gap:12px;align-items:center;padding:12px;
}
.tm-cardbody{min-width:0}
.tm-card h3{margin:0;font-size:17px;font-weight:800;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tm-card h3 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tm-card h3 small{font-size:13px;font-weight:600;color:var(--muted)}
.tm-elapsed{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.tm-steps{display:flex;gap:4px;margin:8px 0 0}
.tm-step{
  flex:1 1 0;min-width:0;text-align:center;font-size:11px;line-height:1.35;
  padding:5px 1px;border-radius:8px;background:#f6f2f0;color:var(--muted);
}
.tm-step.done{background:#eaf4ea;color:var(--ok);font-weight:700}
.tm-step.now{background:var(--brand);color:#fff;font-weight:800}
.tm-step time{display:block;font-size:11px;font-variant-numeric:tabular-nums;opacity:.9}

.tm-main{
  width:100%;height:76px;font-size:19px;font-weight:800;
  border:0;border-radius:16px;background:var(--brand);color:#fff;letter-spacing:0;
  box-shadow:0 4px 0 var(--brand-dark);
}
.tm-main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-dark)}
.tm-main.finish{background:var(--ok);box-shadow:0 4px 0 #1b5e20}
.tm-main.finish:active{box-shadow:0 1px 0 #1b5e20}
/* 暫停中：主按鈕轉灰，一眼看出這張沒在算時間 */
.tm-main.paused{background:#8a7a73;box-shadow:0 4px 0 #6b5c56}
.tm-main.paused:active{box-shadow:0 1px 0 #6b5c56}

.tm-card.is-paused{background:#f7f4f2;border-style:dashed}
.tm-status.paused{color:#6b5c56;font-weight:700}

.tm-foot{grid-column:1 / -1;margin-top:6px;display:flex;align-items:center;gap:10px}
.tm-undo{
  font-size:14px;font-weight:600;padding:10px 14px;
  border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--muted);
  min-height:44px;white-space:nowrap;flex:0 0 auto;
}
.tm-status{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.tm-status.wait{color:var(--wait);font-weight:700}

/* ---------- 出貨 ---------- */
.tm-shipbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.tm-shipbox h3{margin:0 0 4px;font-size:17px;font-weight:800}
.tm-shipmeta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 0 12px}
.tm-bigmain{
  width:100%;height:96px;font-size:26px;font-weight:800;letter-spacing:2px;
  border:0;border-radius:16px;background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-dark);
}
.tm-bigmain:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-dark)}
.tm-bigmain.finish{background:var(--ok);box-shadow:0 4px 0 #1b5e20}
.tm-bigmain.finish:active{box-shadow:0 1px 0 #1b5e20}

/* ---------- 彈出面板 ---------- */
.tm-modal{
  position:fixed;inset:0;z-index:60;background:rgba(43,35,32,.45);
  display:flex;align-items:flex-end;justify-content:center;
}
.tm-sheet{
  width:100%;max-width:430px;max-height:88vh;overflow-y:auto;
  background:var(--bg1);border-radius:20px 20px 0 0;
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,0,0,.18);
}
.tm-sheet h2{margin:0 0 4px;font-size:18px;font-weight:800}
.tm-sheet .hint{margin:0 0 14px;font-size:13px;line-height:1.6;color:var(--muted)}
.tm-sheetfoot{display:flex;gap:10px;margin-top:16px}
.tm-btn{
  flex:1;font-size:16px;font-weight:700;min-height:52px;padding:12px;
  border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);
}
.tm-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.tm-btn.danger{color:#b3261e;border-color:#f0c6c2}
.tm-btn[disabled]{opacity:.45}

.tm-qtyrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tm-qtyrow button{
  flex:0 0 76px;height:76px;font-size:34px;font-weight:800;
  border-radius:18px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);
}
.tm-qtyrow .val{flex:1;text-align:center;font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;background:none;border:0;color:var(--ink);padding:0;min-width:0}
.tm-qtyrow .val .unit{font-size:16px;color:var(--muted);font-weight:600}
.tm-fieldlabel{font-size:13px;font-weight:700;color:var(--muted);margin:16px 2px 6px}

.tm-input{
  width:100%;font-family:var(--font);font-size:17px;padding:12px 14px;min-height:50px;
  border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  -webkit-user-select:text;user-select:text;
}
.tm-chips{display:flex;flex-wrap:wrap;gap:8px}
.tm-chips button{
  font-size:15px;font-weight:700;padding:10px 16px;min-height:46px;
  border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--muted);
}
.tm-chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* 手動補登：左邊寫段落名稱，右邊填分鐘數 */
.tm-segrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tm-segrow span{flex:1;min-width:0;font-size:14px;line-height:1.4;color:var(--ink)}
.tm-segrow .tm-input{flex:0 0 92px;width:92px;text-align:center;font-variant-numeric:tabular-nums}
.tm-daterow{display:flex;gap:8px}
.tm-daterow .tm-input{flex:1;min-width:0}

.tm-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tm-list li{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.tm-list .name{font-size:16px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-list .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:100%;line-height:1.5}
.tm-list .ops{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.tm-list .ops button{
  font-size:13px;font-weight:700;min-height:40px;padding:8px 12px;
  border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--muted);
}
.tm-list .ops button.danger{color:#b3261e;border-color:#f0c6c2}
.tm-badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;flex:0 0 auto}
.tm-badge.wait{background:#fff5e0;color:var(--wait)}
.tm-badge.ok{background:#eaf4ea;color:var(--ok)}
.tm-badge.void{background:#eef0f1;color:var(--void)}
.tm-badge.bad{background:#fdeceb;color:#b3261e}
.tm-why{
  margin:0 0 8px;padding:10px 12px;border-radius:12px;
  background:#fdeceb;color:#7a1f12;font-size:12.5px;line-height:1.6;
}

.tm-toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:80;max-width:92vw;background:var(--shell);color:#fff;
  font-size:14px;line-height:1.5;padding:12px 16px;border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.tm-foothint{margin:26px 2px 0;font-size:12px;line-height:1.7;color:var(--muted)}
.tm-foothint button,.tm-foothint a{
  font-size:12px;font-weight:700;color:var(--muted);background:none;
  border:0;border-bottom:1px dotted var(--muted);padding:2px 0;margin-right:12px;text-decoration:none;
}

/* 比 iPhone SE 還窄的機器：五個階段名擠成三四行會變一團糊，
   這時只留時間，階段靠顏色分辨（做過的綠、現在的橘）。 */
@media (max-width:359px){
  .tm-card{grid-template-columns:1fr 112px}
  .tm-step{font-size:0;padding:4px 1px}
  .tm-step time{font-size:10px}
}

@media (prefers-reduced-motion: reduce){
  .tm-main:active,.tm-bigmain:active{transform:none}
}
</style>
</head>
<body>

<div class="tm-phone">
  <header class="tm-topbar">
    <span class="tm-brandmark">暮日計時</span>
    <button class="tm-pending" id="pendingBtn" type="button"><i></i><span id="pendingText">待確認 0 筆</span></button>
    <button class="tm-sync" id="syncBtn" type="button">立即同步</button>
  </header>

  <div class="tm-warn" id="previewWarn" hidden>⚠️ 這是<strong>本機預覽</strong>，但寫入端點指向<strong>正式試算表</strong>。現在按下去會真的存進去。要試功能請到「設定與還原」把網址改成測試用的。</div>

  <div class="tm-offline" id="offlineBar" hidden>目前沒有網路。按下的時間都存在手機裡，連上網路會自動補送。</div>

  <div class="tm-tabs">
    <button id="tabProd" type="button" aria-pressed="true">生產</button>
    <button id="tabShip" type="button" aria-pressed="false">出貨</button>
  </div>

  <section class="tm-daily" id="dailySummary" aria-live="polite"></section>
  <section class="tm-carry" id="unfinishedAlert" aria-live="polite" hidden></section>

  <main id="viewProd">
    <div class="tm-sectitle">點一下品項，開一張新的計時卡</div>
    <div class="tm-items" id="itemBar"></div>
    <div class="tm-sectitle" id="cardsTitle">進行中（0）</div>
    <div class="tm-cards" id="cards"></div>
    <p class="tm-empty" id="cardsEmpty">還沒有進行中的卡片。點上面的品項開一張。</p>
  </main>

  <main id="viewShip" hidden>
    <div class="tm-sectitle">出貨計時</div>
    <div class="tm-shipbox" id="shipBox"></div>
  </main>

  <p class="tm-foothint">
    <button id="itemsBtn" type="button">品項管理</button>
    <button id="manualBtn" type="button">手動補登</button>
    <button id="settingsBtn" type="button">設定與還原</button>
    <a href="https://script.google.com/macros/s/AKfycbyx25Zsg7RRzHF2PoCvUfl0OUw9MmC8DqillYzGIvRqzRwxrcVksU50z3SssuytJzrN/exec" target="_blank" rel="noopener">查看完整工時歷史 ↗</a>
  </p>
</div>

<div class="tm-modal" id="modal" hidden><div class="tm-sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
(function () {

/* =========================================================================
   暮日甜點｜施作工時計時頁
   規格來源：_context/projects/project_moodri_timer.md
   後端契約：moodri-timer-gas（doPost 寫入 / doGet JSONP 唯讀查核）

   三個非做不可的行為，程式裡到處都在遷就它們，改的時候要記得為什麼：
   1. 多卡片並行 —— 一邊烤費南雪、一邊揉下一爐，只能記一件事的計時器等於沒用
   2. 跨日保留   —— 今天揉麵、隔天烤，卡片一律寫 localStorage，開頁再還原
   3. 離線不掉資料 —— 每筆先寫本機再送出，送出後一律先標「待確認」
   ========================================================================= */

/* ---- 設定 ---------------------------------------------------------- */

// 正式部署的 Web App 網址。端點是公開可寫入的，這點是已拍板接受的風險
//（理由見規格「安全條款」節）。硬性禁令：不得沿用於訂單、客戶或金額資料。
var DEFAULT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzeRMMaHqHoCngMgKJBt0tYHf-cui_1PYWxne8MeFbBngOfM3Wn36y-lVj8tGIzSdpL/exec';

var LIMITS = {
  batch: 50, itemsBatch: 300, channelsBatch: 30, query: 200,
  maxQty: 5000, maxOrderCount: 5000, maxBoxCount: 20000,
  maxAssistMin: 60 * 24 * 7, text: 200, channelText: 20
};
var STAGES = ['開始做', '進烤箱', '出爐', '開始包裝', '包裝完'];
var TIME_KEYS = ['start', 'ovenIn', 'ovenOut', 'packStart', 'packEnd'];
var STAGE_STATUS = ['尚未開始', '製作中', '烤箱中', '冷卻中', '包裝中', '待填數量'];
var DEFAULT_CHANNELS = ['團購', '自售'];
var UNIT_PRESETS = ['盒', '顆', '盤', '片', '條'];

/**
 * 真正在耗人力的兩個階段：1＝製作中（按過開始做）、4＝包裝中（按過開始包裝）。
 * 烤箱中、冷卻中不算人力——那兩段本來就該並行，暫停鍵不出現、也不會被自動互斥碰到。
 */
var LABOR_STAGES = [1, 4];

var K = {
  items: 'moodri.timer.items.v1',
  channels: 'moodri.timer.channels.v1',
  channelsSeeded: 'moodri.timer.channelsseeded.v1',
  cards: 'moodri.timer.cards.v1',
  ship: 'moodri.timer.ship.v1',
  queue: 'moodri.timer.queue.v1',
  endpoint: 'moodri.timer.endpoint.v1',
  lastQty: 'moodri.timer.lastqty.v1',
  lastTrays: 'moodri.timer.lasttrays.v1'
};

// 已查核成功的紀錄留這麼多天再清掉。留著是為了「按錯了要作廢」還找得到那一筆
var KEEP_CONFIRMED_DAYS = 14;

/**
 * 查核成功回來、但這筆不在結果裡，累積這麼多次就判定「送不出去」。
 *
 * 為什麼要有這個：送出走 no-cors，讀不到後端的回應。若某筆被後端驗證擋下來
 * （時間順序、數量超界、字數過長），前端完全不知道，只會每兩分鐘重送一次，
 * 永遠不會成功，而畫面上只有「待確認 1 筆」掛在那裡不動。
 *
 * 判斷依據刻意不是「重送幾次」而是「查得到查核結果、但裡面沒有這筆」：
 * 離線或訊號差時 POST 根本沒出去（sentAt 是空的），不會誤判成被擋。
 */
var STUCK_AFTER_MISSES = 3;

/* ---- 小工具 -------------------------------------------------------- */

function load(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    if (raw === null || raw === undefined) return fallback;
    var v = JSON.parse(raw);
    return (v === null || v === undefined) ? fallback : v;
  } catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { toast('手機存不進去（空間可能滿了），先別關掉這頁'); return false; }
}

function uuid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  var b = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
  else for (var i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  var h = [];
  for (var j = 0; j < 16; j++) h.push((b[j] + 0x100).toString(16).slice(1));
  return h.slice(0, 4).join('') + '-' + h.slice(4, 6).join('') + '-' + h.slice(6, 8).join('') +
         '-' + h.slice(8, 10).join('') + '-' + h.slice(10, 16).join('');
}

function pad(n) { return (n < 10 ? '0' : '') + n; }

/**
 * 輸出帶時區的 ISO 字串。後端用 Date.parse 收，再換算成台北日期，
 * 所以這裡帶「這支手機當下的實際時區」是正確的絕對時間；手機在台灣就等於 +08:00。
 */
function isoLocal(d) {
  var off = -d.getTimezoneOffset();
  var sign = off < 0 ? '-' : '+';
  var abs = Math.abs(off);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
    sign + pad(Math.floor(abs / 60)) + ':' + pad(abs % 60);
}
function localDateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtClock(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fmtSpan(ms) {
  if (!(ms >= 0)) return '';
  var m = Math.floor(ms / 60000);
  if (m < 60) return '已 ' + m + ' 分';
  return '已 ' + Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分';
}
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }
function trimText(s) { return String(s === null || s === undefined ? '' : s).trim().slice(0, LIMITS.text); }

/**
 * 跑在本機預覽、但端點卻指向正式試算表 —— 這是會出事的組合。
 *
 * 2026-08-07 就是這樣把三列煙霧測試資料寫進正式表的：
 * 收尾清測試資料時把「指向假後端」的設定一起清掉，還原成正式端點，
 * 然後才把 localhost 網址交出去。等於拆掉護欄才交鑰匙。
 * 正式站（GitHub Pages）不會顯示這條，因為那本來就該連正式的。
 */
function isLocalPreviewOnProd() {
  var local = /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);
  return local && /^https:\/\/script\.google\.com\//.test(S.endpoint);
}

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('tmToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'tmToast';
    el.className = 'tm-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
}

/* ---- 狀態 ---------------------------------------------------------- */

var S = {
  items: load(K.items, []),
  channels: load(K.channels, []),
  cards: load(K.cards, []),
  ship: load(K.ship, null),
  queue: load(K.queue, []),
  endpoint: load(K.endpoint, '') || DEFAULT_ENDPOINT,
  lastQty: load(K.lastQty, {}),
  lastTrays: load(K.lastTrays, {}),
  tab: 'prod'
};

function saveItems() { save(K.items, S.items); }
function saveChannels() { save(K.channels, S.channels); }
function saveCards() { save(K.cards, S.cards); }
function saveShip() { save(K.ship, S.ship); }
function saveQueue() { save(K.queue, S.queue); }

function liveItems() {
  return S.items.filter(function (it) { return !it.deleted; })
    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
}
function findItem(itemUuid) {
  for (var i = 0; i < S.items.length; i++) if (S.items[i].itemUuid === itemUuid) return S.items[i];
  return null;
}
function liveChannels() {
  return S.channels.filter(function (ch) { return !ch.deleted; })
    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
}
function findChannel(channelUuid) {
  for (var i = 0; i < S.channels.length; i++) if (S.channels[i].channelUuid === channelUuid) return S.channels[i];
  return null;
}
function pendingRecords() {
  return S.queue.filter(function (q) { return !isListType(q.type) && q.state === 'pending'; });
}
function stuckRecords() {
  return S.queue.filter(function (q) { return q.state === 'stuck'; });
}

/* ---- 佇列（送出前一律先進這裡） ------------------------------------ */

/**
 * 進佇列。同一個 uuid 只留一筆：更正就是「同 UUID + 較大的修訂序號」，
 * 舊的那筆留著只會讓補送時把舊值又推上去一次。
 */
/** 清單型備份（品項、通路）：沒有查核管道，送出去就算數，不留在「待確認」裡 */
function isListType(type) { return type === 'items' || type === 'channels'; }

function enqueue(type, record, label) {
  var key = record.uuid || record.itemUuid || record.channelUuid;
  var idx = -1;
  for (var i = 0; i < S.queue.length; i++) {
    if (S.queue[i].type === type && S.queue[i].key === key) { idx = i; break; }
  }
  var entry = {
    qid: idx >= 0 ? S.queue[idx].qid : uuid(),
    type: type,
    key: key,
    rev: isListType(type) ? 0 : record.rev,
    state: 'pending',
    miss: 0,   // 改過內容就重新算，之前被擋下來的理由可能已經修好了
    label: label || (idx >= 0 ? S.queue[idx].label : ''),
    createdAt: idx >= 0 ? S.queue[idx].createdAt : isoLocal(new Date()),
    updatedAt: isoLocal(new Date()),
    data: record
  };
  if (idx >= 0) S.queue[idx] = entry; else S.queue.push(entry);
  saveQueue();
  return entry;
}

function pruneQueue() {
  var cutoff = Date.now() - KEEP_CONFIRMED_DAYS * 86400000;
  var before = S.queue.length;
  S.queue = S.queue.filter(function (q) {
    if (q.state !== 'confirmed') return true;
    var t = Date.parse(q.updatedAt || q.createdAt || '');
    return isNaN(t) ? true : t >= cutoff;
  });
  if (S.queue.length !== before) saveQueue();
}

/* ---- 送出與查核 ---------------------------------------------------- */

var syncing = false;

/**
 * 同步進行中又有人要求同步時，記下來、跑完再補一次。
 * 早期版本是直接丟掉，結果連續補登幾筆或連按幾個品項時，
 * 後面那幾筆會卡在佇列裡等兩分鐘的定時同步才送出去。
 * 資料不會掉，但「按完就送出去了」的預期會落空。
 */
var syncAgain = false;
function drainSyncAgain() {
  if (!syncAgain) return;
  syncAgain = false;
  sync(true);
}

function post(type, records) {
  // no-cors：讀不到回應，所以「送出成功」只代表送出去了，不代表寫進試算表。
  // 真正算數的是後面 JSONP 查核那一步。
  return fetch(S.endpoint, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ type: type, records: records })
  });
}

var jsonpSeq = 0;
function jsonp(params, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var name = 'moodriTimerCb' + (++jsonpSeq) + '_' + Math.floor(Math.random() * 1e6);
    var script = document.createElement('script');
    var done = false;
    var timer = setTimeout(function () { finish(new Error('查核逾時')); }, timeoutMs || 20000);

    function finish(err, data) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      if (err) reject(err); else resolve(data);
    }
    window[name] = function (data) { finish(null, data); };
    script.onerror = function () { finish(new Error('查核連線失敗')); };

    var qs = ['callback=' + encodeURIComponent(name)];
    for (var k in params) {
      if (Object.prototype.hasOwnProperty.call(params, k)) qs.push(k + '=' + encodeURIComponent(params[k]));
    }
    script.src = S.endpoint + '?' + qs.join('&');
    document.head.appendChild(script);
  });
}

function chunk(arr, size) {
  var out = [];
  for (var i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

/**
 * 送出佇列裡所有待送的東西，然後查核。
 * silent=true 時不跳提示（自動同步用），使用者按「立即同步」才報結果。
 */
function sync(silent) {
  if (syncing) { syncAgain = true; return Promise.resolve(); }
  var outbox = S.queue.filter(function (q) { return q.state === 'pending'; });
  var toCheck = pendingRecords();
  if (outbox.length === 0 && toCheck.length === 0) {
    if (!silent) toast('沒有待處理的紀錄');
    return Promise.resolve();
  }
  if (!navigator.onLine) {
    if (!silent) toast('目前離線。資料都在手機裡，連上網路會自動補送');
    return Promise.resolve();
  }

  syncing = true;
  render();

  var byType = { production: [], shipping: [], items: [], channels: [] };
  outbox.forEach(function (q) { if (byType[q.type]) byType[q.type].push(q); });

  var BATCH_SIZE = { items: LIMITS.itemsBatch, channels: LIMITS.channelsBatch };
  var jobs = [];
  ['production', 'shipping', 'items', 'channels'].forEach(function (type) {
    var size = BATCH_SIZE[type] || LIMITS.batch;
    chunk(byType[type], size).forEach(function (group) { jobs.push({ type: type, group: group }); });
  });

  var sentOk = 0;
  var failed = 0;

  var chain = jobs.reduce(function (p, job) {
    return p.then(function () {
      return post(job.type, job.group.map(function (q) { return q.data; })).then(function () {
        sentOk += job.group.length;
        job.group.forEach(function (q) {
          if (isListType(q.type)) {
            // 品項與通路都是單向備份，後端也沒有查核管道（JSONP 只查生產／出貨的 UUID），
            // 所以送出去就算數，不留在佇列裡。
            q.state = 'sent';
          }
          q.sentAt = isoLocal(new Date());
        });
      }).catch(function () { failed += job.group.length; });
    });
  }, Promise.resolve());

  return chain.then(function () {
    S.queue = S.queue.filter(function (q) { return q.state !== 'sent'; });
    saveQueue();
    return check(true);
  }).then(function (res) {
    syncing = false;
    render();
    if (!silent) {
      if (failed > 0) toast('送出 ' + sentOk + ' 筆，' + failed + ' 筆沒送成功，稍後會再試');
      else if (res && res.confirmed > 0) toast('已同步 ' + res.confirmed + ' 筆，還有 ' + pendingRecords().length + ' 筆待確認');
      else toast('已送出。還有 ' + pendingRecords().length + ' 筆待確認');
    }
    drainSyncAgain();
  }).catch(function (err) {
    syncing = false;
    render();
    if (!silent) toast('同步沒完成：' + (err && err.message ? err.message : '未知錯誤'));
    drainSyncAgain();
  });
}

/**
 * 查核。把本機「待確認」的 UUID 交給後端，後端只回其中確實存在的那些。
 * 不是抓「最近 N 筆」——佇列較多或補送時那種做法會漏判。
 */
function check(silent) {
  var list = pendingRecords();
  if (list.length === 0) return Promise.resolve({ confirmed: 0 });
  if (!navigator.onLine) return Promise.resolve({ confirmed: 0 });

  var groups = chunk(list, LIMITS.query);
  var confirmed = 0;
  var newlyStuck = 0;

  return groups.reduce(function (p, group) {
    return p.then(function () {
      return jsonp({ uuids: group.map(function (q) { return q.key; }).join(',') }).then(function (res) {
        if (!res || !res.ok || !Array.isArray(res.found)) return;
        var map = {};
        res.found.forEach(function (f) { map[f.uuid] = Number(f.rev); });
        group.forEach(function (q) {
          var rev = map[q.key];
          // 只有「試算表上的修訂序號 >= 我送出的」才算數。
          // 送了新版本但後端還停在舊版本，代表這次覆寫沒吃到，要留著再送。
          if (rev !== undefined && !isNaN(rev) && rev >= q.rev) {
            q.state = 'confirmed';
            q.miss = 0;
            q.updatedAt = isoLocal(new Date());
            confirmed++;
          } else if (q.sentAt) {
            // 查核通了、後端也回話了，就是沒有這筆——而且它確實送出去過。
            // 這是「被後端擋下來」的證據，不是網路問題。
            q.miss = (q.miss || 0) + 1;
            if (q.miss >= STUCK_AFTER_MISSES) {
              q.state = 'stuck';
              q.updatedAt = isoLocal(new Date());
              newlyStuck++;
            }
          }
        });
      });
    });
  }, Promise.resolve()).then(function () {
    if (confirmed > 0 || newlyStuck > 0) saveQueue();
    if (newlyStuck > 0) toast(newlyStuck + ' 筆送不出去，點上面的紅字看是哪幾筆');
    else if (!silent && confirmed === 0) toast('查核完成，還沒有新的一筆寫進試算表');
    return { confirmed: confirmed, stuck: newlyStuck };
  });
}

/* ---- 生產：狀態機 -------------------------------------------------- */

/**
 * 自動編「第 N 爐」。廚房裡手是髒的，能不打字就不打字；要改再進更正面板改。
 *
 * 爐號延到按下「開始做」那一刻才決定，不在建立卡片時就編。
 * 因為一筆紀錄的日期取的是「開始做」的日期：昨天開的卡今天才按開始做，
 * 資料算今天，卻會跟今天新開的卡撞成同一個第 1 爐。
 *
 * 算法是掃「同品項、同一天」已經用掉的爐號取最大值 +1，不是數張數——
 * 使用者手改過批次備註時，數張數會重複編號。
 */
function nextBatchNote(itemUuid, dateKey) {
  var used = 0;
  function take(text) {
    var m = /第\s*(\d+)\s*爐/.exec(String(text || ''));
    if (m) used = Math.max(used, Number(m[1]));
  }
  S.cards.forEach(function (c) {
    if (c.itemUuid !== itemUuid || !c.times.start) return;
    if (localDateKey(new Date(c.times.start)) !== dateKey) return;
    take(c.batchNote);
  });
  S.queue.forEach(function (q) {
    if (q.type !== 'production' || !q.data) return;
    if (q.data.itemUuid !== itemUuid || q.data.date !== dateKey) return;
    take(q.data.batchNote);
  });
  return '第' + (used + 1) + '爐';
}

/** 盤數接在批次備註後面（`第1爐・3盤`）。烤箱產能是用盤算的，那是目前唯一缺的產能資料 */
function withTrays(batchNote, trays) {
  var base = String(batchNote || '');
  if (!(trays > 0)) return base;
  return base ? base + '・' + trays + '盤' : trays + '盤';
}

function addCard(itemUuid) {
  var item = findItem(itemUuid);
  if (!item) return;
  var card = {
    id: uuid(),
    itemUuid: item.itemUuid,
    itemName: item.name,     // 名稱快照：之後改名，這張卡與寫出去的紀錄都不跟著變
    unit: item.unit || '',
    batchNote: '',                            // 按下「開始做」才編爐號，理由見 nextBatchNote
    createdDate: localDateKey(new Date()),
    stage: 0,
    times: {},
    note: ''
  };
  S.cards.push(card);
  saveCards();
  render();
}

function findCard(id) {
  for (var i = 0; i < S.cards.length; i++) if (S.cards[i].id === id) return S.cards[i];
  return null;
}

/* ---- 生產：暫停／繼續與人力互斥 ------------------------------------ */

/**
 * 為什麼暫停要另外記一個數字、而不是把時間戳往後挪：
 * 挪時間戳等於竄改紀錄，上傳的「開始做 09:00、進烤箱 10:00」會跟真實時鐘對不上，
 * 事後查帳沒人搞得懂。存暫停分鐘，五個時間點就還是真的那五個時間點。
 */
function inLaborStage(c) { return LABOR_STAGES.indexOf(c.stage) >= 0; }
function isPaused(c) { return !!c.pauseStartedAt; }

/** 累計暫停毫秒。正在暫停中的話，把「這一段還在跑的」也算進去 */
function pausedTotalMs(c) {
  var base = c.pausedMs || 0;
  if (c.pauseStartedAt) {
    var d = Date.now() - new Date(c.pauseStartedAt).getTime();
    if (d > 0) base += d;
  }
  return base;
}
function pauseMinutes(c) { return Math.round(pausedTotalMs(c) / 60000 * 10) / 10; }

/** 卡片右下角那行字。暫停中就只講暫停了幾分，別再重複一次「已暫停」 */
function cardStatusText(c) {
  var pm = pauseMinutes(c);
  if (isPaused(c)) return '已暫停 ' + pm + ' 分';
  var st = STAGE_STATUS[Math.min(c.stage, STAGE_STATUS.length - 1)];
  return pm > 0 ? st + '・暫停過 ' + pm + ' 分' : st;
}

/** 把還在跑的那一段結算進 pausedMs，並解除暫停狀態。已經沒在暫停就什麼都不做 */
function settlePause(c) {
  if (!c.pauseStartedAt) return;
  c.pausedMs = pausedTotalMs(c);
  c.pauseStartedAt = null;
}

/**
 * 人力階段自動互斥：同一時間只允許一張卡在算人力。
 *
 * 以前兩張卡同時停在「製作中」時，兩邊的人力會各自累加，等於同一段時間被算了兩次。
 * 這條就是把規格裡「一個人同時只能做一件事」真的寫進程式。
 * 只管製作中／包裝中，烤箱中與冷卻中本來就該並行，不可誤暫停。
 */
function pauseOtherLaborCards(exceptId) {
  var paused = [];
  S.cards.forEach(function (o) {
    if (o.id === exceptId || !inLaborStage(o) || isPaused(o)) return;
    o.pauseStartedAt = isoLocal(new Date());
    paused.push(o.itemName + (o.batchNote ? ' ' + o.batchNote : ''));
  });
  if (paused.length > 0) toast('已自動暫停 ' + paused.join('、'));
  return paused.length;
}

function pauseCard(id) {
  var c = findCard(id);
  if (!c || !inLaborStage(c) || isPaused(c)) return;
  c.pauseStartedAt = isoLocal(new Date());
  saveCards();
  render();
}

function resumeCard(id) {
  var c = findCard(id);
  if (!c || !isPaused(c)) return;
  settlePause(c);
  pauseOtherLaborCards(c.id);   // 繼續等於重新開始佔用人力，其他張要讓開
  saveCards();
  render();
}

function advance(id) {
  var c = findCard(id);
  if (!c) return;
  if (isPaused(c)) { resumeCard(id); return; }   // 暫停中主按鈕是「▶ 繼續」
  if (c.stage >= TIME_KEYS.length) { openQty(c.id); return; }
  var now = new Date();
  var prevKey = c.stage > 0 ? TIME_KEYS[c.stage - 1] : null;
  if (prevKey && c.times[prevKey] && new Date(c.times[prevKey]).getTime() > now.getTime()) {
    // 手機時間被改過（或使用者調了系統時間）才會走到這。允許相等，但不允許倒退
    toast('手機時間比上一步還早，這一步先不記');
    return;
  }
  c.times[TIME_KEYS[c.stage]] = isoLocal(now);
  if (c.stage === 0) c.batchNote = nextBatchNote(c.itemUuid, localDateKey(now));
  c.stage++;
  // 剛踏進人力階段，其他還在算人力的卡片要自動暫停
  if (inLaborStage(c)) pauseOtherLaborCards(c.id);
  saveCards();
  render();
  if (c.stage >= TIME_KEYS.length) openQty(c.id);
}

function undo(id) {
  var c = findCard(id);
  if (!c) return;
  if (c.stage === 0) {
    if (!window.confirm('這張「' + c.itemName + '」還沒開始，要刪掉嗎？')) return;
    S.cards = S.cards.filter(function (x) { return x.id !== id; });
    saveCards();
    render();
    return;
  }
  settlePause(c);   // 退回上一步時不要留著一個還在跑的暫停，否則會一直累積
  c.stage--;
  delete c.times[TIME_KEYS[c.stage]];
  // 復原掉「開始做」就把爐號還回去，否則這個號碼會被佔著，下一張卡跳號
  if (c.stage === 0) { c.batchNote = ''; c.pausedMs = 0; }
  saveCards();
  render();
}

/* ---- 生產：數量輸入與送出 ------------------------------------------ */

var qtyState = null;

function openQty(cardId) {
  var c = findCard(cardId);
  if (!c) return;
  var last = S.lastQty[c.itemUuid];
  var lastT = S.lastTrays[c.itemUuid];
  qtyState = {
    cardId: cardId,
    qty: (typeof last === 'number' && last > 0) ? last : 1,
    trays: (typeof lastT === 'number' && lastT > 0) ? String(lastT) : '',
    note: c.note || ''
  };
  renderQtySheet();
}

function captureQtyInputs() {
  if (!qtyState) return;
  var q = document.getElementById('qtyVal');
  var t = document.getElementById('qtyTrays');
  var n = document.getElementById('qtyNote');
  if (q && q.value !== '') qtyState.qty = Math.round(Number(q.value)) || 0;
  if (t) qtyState.trays = t.value;
  if (n) qtyState.note = n.value;
}

function renderQtySheet() {
  var c = findCard(qtyState.cardId);
  if (!c) { closeSheet(); return; }
  var unit = c.unit || '';
  sheetHtml(
    '<h2>' + esc(c.itemName) + ' 做好了</h2>' +
    '<p class="hint">' + esc(c.batchNote) + '｜' + fmtClock(c.times.start) + ' 開始，' + fmtClock(c.times.packEnd) + ' 包完。做出幾' + esc(unit || '份') + '？</p>' +
    '<div class="tm-qtyrow">' +
      '<button type="button" data-act="qty-" aria-label="減一">−</button>' +
      '<input class="val" id="qtyVal" type="number" inputmode="numeric" min="0" max="' + LIMITS.maxQty + '" value="' + qtyState.qty + '">' +
      '<button type="button" data-act="qty+" aria-label="加一">＋</button>' +
    '</div>' +
    '<div class="tm-chips" style="justify-content:center">' +
      '<button type="button" data-act="qty-10">−10</button>' +
      '<button type="button" data-act="qty+10">＋10</button>' +
      (unit ? '<span style="align-self:center;font-size:15px;color:var(--muted);font-weight:700">單位：' + esc(unit) + '</span>' : '') +
    '</div>' +
    '<div class="tm-segrow" style="margin-top:16px">' +
      '<span>用了幾盤（可留空）</span>' +
      '<input class="tm-input" id="qtyTrays" type="number" inputmode="numeric" min="0" max="99" value="' + esc(qtyState.trays) + '">' +
    '</div>' +
    '<div class="tm-fieldlabel">備註（可留空）</div>' +
    '<input class="tm-input" id="qtyNote" type="text" maxlength="' + LIMITS.text + '" value="' + esc(qtyState.note) + '" placeholder="例：外皮偏深，下爐降 10 度">' +
    '<div class="tm-sheetfoot">' +
      '<button class="tm-btn" type="button" data-act="qty-back">↩ 回上一步</button>' +
      '<button class="tm-btn primary" type="button" data-act="qty-ok">完成，記下來</button>' +
    '</div>'
  );
}

function bumpQty(delta) {
  var input = document.getElementById('qtyVal');
  var cur = input ? Number(input.value) : qtyState.qty;
  if (isNaN(cur)) cur = 0;
  qtyState.qty = clamp(Math.round(cur + delta), 0, LIMITS.maxQty);
  if (input) input.value = qtyState.qty;
}

function buildProduction(card, qty, note, rev, status) {
  return {
    uuid: card.recordUuid || uuid(),
    itemUuid: card.itemUuid,
    itemName: card.itemName,
    batchNote: card.batchNote || '',
    start: card.times.start,
    ovenIn: card.times.ovenIn,
    ovenOut: card.times.ovenOut,
    packStart: card.times.packStart,
    packEnd: card.times.packEnd,
    qty: qty,
    unit: card.unit || '',
    pauseMin: pauseMinutes(card),
    note: note || '',
    status: status || '正常',
    rev: rev || 0,
    date: localDateKey(new Date(card.times.start))   // 本機自用（自動編爐號、面板分組），後端會自己重算
  };
}

function commitQty() {
  var c = findCard(qtyState.cardId);
  if (!c) { closeSheet(); return; }
  captureQtyInputs();
  var qty = Math.round(Number(qtyState.qty));
  if (isNaN(qty) || qty < 0 || qty > LIMITS.maxQty) { toast('數量要在 0～' + LIMITS.maxQty + ' 之間'); return; }
  var trays = qtyState.trays === '' ? 0 : Math.round(Number(qtyState.trays));
  if (isNaN(trays) || trays < 0 || trays > 99) { toast('盤數要在 0～99 之間，不知道就留空'); return; }
  var note = trimText(qtyState.note);

  settlePause(c);   // 還在暫停中就先結算，pauseMin 才是完整的
  var rec = buildProduction(c, qty, note, 0, '正常');
  // 暫停比實際工作還久會被後端擋下，在這裡先講清楚，不要讓它變成「送不出去」的一筆
  var gross = laborGrossMin(rec);
  if (rec.pauseMin > gross) {
    toast('暫停 ' + rec.pauseMin + ' 分比實際工作的 ' + gross + ' 分還久，先到紀錄面板確認一下');
    return;
  }
  rec.batchNote = withTrays(c.batchNote, trays);
  enqueue('production', rec, c.itemName + '｜' + (rec.batchNote || ''));
  S.lastQty[c.itemUuid] = qty;
  save(K.lastQty, S.lastQty);
  if (trays > 0) { S.lastTrays[c.itemUuid] = trays; save(K.lastTrays, S.lastTrays); }
  S.cards = S.cards.filter(function (x) { return x.id !== c.id; });
  saveCards();
  closeSheet();
  render();
  toast('已記下 ' + c.itemName + ' ' + qty + (c.unit || '') + '，待確認');
  sync(true);
}

/* ---- 出貨 ---------------------------------------------------------- */

function startShip() {
  S.ship = { id: uuid(), start: isoLocal(new Date()) };
  saveShip();
  render();
}
function undoShip() {
  if (!S.ship) return;
  if (!window.confirm('要取消這次出貨計時嗎？（已按的開始時間會消失）')) return;
  S.ship = null;
  saveShip();
  render();
}
var shipState = null;
function endShip() {
  if (!S.ship) return;
  var end = isoLocal(new Date());
  if (new Date(end).getTime() < new Date(S.ship.start).getTime()) { toast('結束時間比開始還早，先確認手機時間'); return; }
  shipState = { start: S.ship.start, end: end, channel: '', items: [], orderCount: 1, boxCount: 1, assist: '', note: '' };
  renderShipSheet();
}

/**
 * 重畫這張表單前先把已經打好的數字撈回 shipState。
 * 不做的話，選一下通路或品項就把剛剛輸入的訂單筆數清成預設值。
 */
function captureShipInputs() {
  if (!shipState) return;
  var o = document.getElementById('ordVal');
  var b = document.getElementById('boxVal');
  var a = document.getElementById('shipAssist');
  var n = document.getElementById('shipNote');
  if (o && o.value !== '') shipState.orderCount = Math.max(0, Math.round(Number(o.value)) || 0);
  if (b && b.value !== '') shipState.boxCount = Math.max(0, Math.round(Number(b.value)) || 0);
  if (a) shipState.assist = a.value;
  if (n) shipState.note = n.value;
}

function renderShipSheet() {
  var mins = Math.round((new Date(shipState.end) - new Date(shipState.start)) / 60000);
  var items = liveItems();
  var chans = liveChannels();
  sheetHtml(
    '<h2>這趟出貨做完了</h2>' +
    '<p class="hint">' + fmtClock(shipState.start) + ' → ' + fmtClock(shipState.end) + '，共 ' + mins + ' 分鐘。</p>' +
    '<div class="tm-fieldlabel">通路</div>' +
    (chans.length
      ? '<div class="tm-chips">' + chans.map(function (ch) {
          return '<button type="button" data-act="ship-ch" data-ch="' + esc(ch.name) + '" aria-pressed="' + (shipState.channel === ch.name) + '">' + esc(ch.name) + '</button>' ;
        }).join('') + '<button type="button" data-act="open-channels">⚙ 管理通路</button></div>'
      : '<p class="tm-empty">還沒有通路。<button type="button" data-act="open-channels">建立通路</button></p>') +
    // 只記「這批出的是哪些品項」，不記各自花多久。
    // 包一張訂單時手上同時有好幾個品項，硬要拆成各自幾分鐘只能用猜的。
    // 之後某批剛好是單一品項，就能回頭比較不同品項的每筆時間；混批就當混批看。
    '<div class="tm-fieldlabel">這批出的品項（可複選，可不選）</div>' +
    (items.length
      ? '<div class="tm-chips">' + items.map(function (it) {
          return '<button type="button" data-act="ship-item" data-id="' + esc(it.itemUuid) + '" aria-pressed="' + (shipState.items.indexOf(it.itemUuid) >= 0) + '">' + esc(it.name) + '</button>';
        }).join('') + '</div>'
      : '<p class="tm-empty">還沒有品項，可以先跳過。</p>') +
    '<div class="tm-fieldlabel">訂單筆數</div>' +
    '<div class="tm-qtyrow">' +
      '<button type="button" data-act="ord-" aria-label="訂單筆數減一">−</button>' +
      '<input class="val" id="ordVal" type="number" inputmode="numeric" min="0" max="' + LIMITS.maxOrderCount + '" value="' + shipState.orderCount + '">' +
      '<button type="button" data-act="ord+" aria-label="訂單筆數加一">＋</button>' +
    '</div>' +
    '<div class="tm-fieldlabel">總盒數</div>' +
    '<div class="tm-qtyrow">' +
      '<button type="button" data-act="box-" aria-label="總盒數減一">−</button>' +
      '<input class="val" id="boxVal" type="number" inputmode="numeric" min="0" max="' + LIMITS.maxBoxCount + '" value="' + shipState.boxCount + '">' +
      '<button type="button" data-act="box+" aria-label="總盒數加一">＋</button>' +
    '</div>' +
    // 記「協助了幾分鐘」而不是「幾個人」：協助者不是全程也不是主力，
    // 記人數等於假設兩個人從頭做到尾，人力會直接高估一倍
    '<div class="tm-segrow" style="margin-top:16px">' +
      '<span>有人幫忙幾分鐘（沒有就留空）</span>' +
      '<input class="tm-input" id="shipAssist" type="number" inputmode="numeric" min="0" value="' + esc(shipState.assist) + '">' +
    '</div>' +
    '<div class="tm-fieldlabel">備註（可留空）</div>' +
    '<input class="tm-input" id="shipNote" type="text" maxlength="' + LIMITS.text + '" value="' + esc(shipState.note) + '">' +
    '<div class="tm-sheetfoot">' +
      '<button class="tm-btn" type="button" data-act="ship-cancel">↩ 還沒好，回去</button>' +
      '<button class="tm-btn primary" type="button" data-act="ship-ok">完成，記下來</button>' +
    '</div>'
  );
}

function commitShip() {
  if (!shipState.channel) { toast('先選通路'); return; }
  var ord = Math.round(Number(document.getElementById('ordVal').value));
  var box = Math.round(Number(document.getElementById('boxVal').value));
  if (isNaN(ord) || ord < 0 || ord > LIMITS.maxOrderCount) { toast('訂單筆數要在 0～' + LIMITS.maxOrderCount + ' 之間'); return; }
  if (isNaN(box) || box < 0 || box > LIMITS.maxBoxCount) { toast('總盒數要在 0～' + LIMITS.maxBoxCount + ' 之間'); return; }
  var assistEl = document.getElementById('shipAssist');
  var assistRaw = assistEl ? String(assistEl.value).trim() : '';
  var assist = assistRaw === '' ? 0 : Number(assistRaw);
  if (isNaN(assist) || assist < 0 || assist > LIMITS.maxAssistMin) { toast('協助分鐘要是 0 以上的數字，沒有就留空'); return; }

  // 品項寫進 note，不另開欄位：後端的出貨分頁欄位是固定的，
  // 加欄位要連 validateShipping 一起改再重新部署，第一版不划算。
  var picked = shipState.items.map(function (id) {
    var it = findItem(id);
    return it ? it.name : null;
  }).filter(Boolean);
  var typed = trimText(document.getElementById('shipNote').value);
  var note = picked.length
    ? trimText('品項：' + picked.join('、') + (typed ? '｜' + typed : ''))
    : typed;

  var rec = {
    uuid: uuid(),
    channel: shipState.channel,
    start: shipState.start,
    end: shipState.end,
    orderCount: ord,
    boxCount: box,
    assistMin: assist,
    note: note,
    status: '正常',
    rev: 0,
    date: localDateKey(new Date(shipState.start))
  };
  enqueue('shipping', rec, '出貨｜' + shipState.channel + ' ' + ord + ' 筆');
  S.ship = null;
  saveShip();
  shipState = null;
  closeSheet();
  render();
  toast('出貨已記下，待確認');
  sync(true);
}

/* ---- 手動補登（紙本回填、當下忘記按時用） -------------------------- */

/**
 * 為什麼是填「每段幾分鐘」而不是填五個時鐘時間：
 * 紙本上寫的本來就是「麵糊 30 分鐘」「入模到包裝 40 分鐘」這種段落長度，
 * 沒有人會記下 09:03 進烤箱。填時長，五個時間點由程式往後推，順序也保證遞增。
 */
var manualState = null;
var MANUAL_SEGS = [
  { key: 'prep', id: 'mPrep', label: '備料到進烤箱（算人力）' },
  { key: 'bake', id: 'mBake', label: '烤箱：進烤箱到出爐' },
  { key: 'cool', id: 'mCool', label: '冷卻：出爐到開始包裝' },
  { key: 'pack', id: 'mPack', label: '包裝：開始包裝到包裝完（算人力）' }
];

function openManual() {
  manualState = {
    itemUuid: '', date: localDateKey(new Date()), time: '09:00',
    prep: '', bake: '', cool: '', pack: '', qty: '', trays: '', batchNote: '', note: ''
  };
  renderManualSheet();
}

function captureManual() {
  if (!manualState) return;
  var pairs = [['mDate', 'date'], ['mTime', 'time'], ['mQty', 'qty'], ['mTrays', 'trays'], ['mBatch', 'batchNote'], ['mNote', 'note']];
  MANUAL_SEGS.forEach(function (s) { pairs.push([s.id, s.key]); });
  pairs.forEach(function (p) {
    var el = document.getElementById(p[0]);
    if (el) manualState[p[1]] = el.value;
  });
}

function renderManualSheet() {
  var items = liveItems();
  var picked = findItem(manualState.itemUuid);
  var segRows = MANUAL_SEGS.map(function (s) {
    return '<div class="tm-segrow">' +
      '<span>' + s.label + '</span>' +
      '<input class="tm-input" id="' + s.id + '" type="number" inputmode="numeric" min="0" value="' + esc(manualState[s.key]) + '">' +
    '</div>';
  }).join('');

  sheetHtml(
    '<h2>手動補登一筆</h2>' +
    '<p class="hint">紙本回填、或當下忘記按的時候用。填「每段花多久」就好，五個時間點由程式往後推。' +
    '<strong>不知道的段落不要填 0</strong>——0 的意思是「真的沒花時間」，填錯會把平均值拉歪，' +
    '而定價就是看這些平均值算出來的。</p>' +
    '<div class="tm-fieldlabel">品項</div>' +
    (items.length
      ? '<div class="tm-chips">' + items.map(function (it) {
          return '<button type="button" data-act="m-item" data-id="' + esc(it.itemUuid) + '" aria-pressed="' + (manualState.itemUuid === it.itemUuid) + '">' + esc(it.name) + '</button>';
        }).join('') + '</div>'
      : '<p class="tm-empty">還沒有品項，先去「品項管理」建一個。</p>') +
    '<div class="tm-fieldlabel">日期與「開始做」的時間</div>' +
    '<div class="tm-daterow">' +
      '<input class="tm-input" id="mDate" type="date" value="' + esc(manualState.date) + '">' +
      '<input class="tm-input" id="mTime" type="time" value="' + esc(manualState.time) + '">' +
    '</div>' +
    '<div class="tm-fieldlabel">各段花了幾分鐘</div>' +
    segRows +
    '<div class="tm-fieldlabel">產出數量' + (picked && picked.unit ? '（' + esc(picked.unit) + '）' : '') + '</div>' +
    '<input class="tm-input" id="mQty" type="number" inputmode="numeric" min="0" max="' + LIMITS.maxQty + '" value="' + esc(manualState.qty) + '">' +
    '<div class="tm-segrow" style="margin-top:12px">' +
      '<span>用了幾盤（可留空）</span>' +
      '<input class="tm-input" id="mTrays" type="number" inputmode="numeric" min="0" max="99" value="' + esc(manualState.trays) + '">' +
    '</div>' +
    '<div class="tm-fieldlabel">批次備註</div>' +
    '<input class="tm-input" id="mBatch" type="text" maxlength="' + LIMITS.text + '" value="' + esc(manualState.batchNote) + '" placeholder="例：紙本補登">' +
    '<div class="tm-fieldlabel">備註</div>' +
    '<input class="tm-input" id="mNote" type="text" maxlength="' + LIMITS.text + '" value="' + esc(manualState.note) + '">' +
    '<div class="tm-sheetfoot">' +
      '<button class="tm-btn" type="button" data-act="close">取消</button>' +
      '<button class="tm-btn primary" type="button" data-act="m-ok">補登這一筆</button>' +
    '</div>'
  );
}

function commitManual() {
  captureManual();
  var item = findItem(manualState.itemUuid);
  if (!item) { toast('先選品項'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(manualState.date)) { toast('日期格式不對'); return; }
  if (!/^\d{1,2}:\d{2}/.test(manualState.time)) { toast('時間格式不對'); return; }

  var mins = [];
  for (var i = 0; i < MANUAL_SEGS.length; i++) {
    var raw = manualState[MANUAL_SEGS[i].key];
    var v = Number(raw);
    if (raw === '' || isNaN(v) || v < 0) { toast('四段時長都要填。不知道的先問清楚再補登，不要填 0'); return; }
    mins.push(v);
  }

  var qty = Number(manualState.qty);
  if (manualState.qty === '' || isNaN(qty) || qty < 0 || qty > LIMITS.maxQty) {
    toast('數量要在 0～' + LIMITS.maxQty + ' 之間'); return;
  }
  var trays = manualState.trays === '' ? 0 : Math.round(Number(manualState.trays));
  if (isNaN(trays) || trays < 0 || trays > 99) { toast('盤數要在 0～99 之間，不知道就留空'); return; }

  var start = new Date(manualState.date + 'T' + manualState.time.slice(0, 5) + ':00');
  if (isNaN(start.getTime())) { toast('日期或時間讀不出來'); return; }

  var t = start.getTime();
  var stamps = [new Date(t)];
  for (var j = 0; j < mins.length; j++) { t += mins[j] * 60000; stamps.push(new Date(t)); }

  var rec = {
    uuid: uuid(),
    itemUuid: item.itemUuid,
    itemName: item.name,
    batchNote: withTrays(trimText(manualState.batchNote) || '手動補登', trays),
    start: isoLocal(stamps[0]), ovenIn: isoLocal(stamps[1]), ovenOut: isoLocal(stamps[2]),
    packStart: isoLocal(stamps[3]), packEnd: isoLocal(stamps[4]),
    qty: Math.round(qty),
    unit: item.unit || '',
    // 補登填的是「每段實際花多久」，等待的時間本來就沒被算進去，不需要再扣暫停
    pauseMin: 0,
    note: trimText(manualState.note),
    status: '正常',
    rev: 0,
    date: localDateKey(stamps[0])
  };
  enqueue('production', rec, item.name + '｜' + rec.batchNote);
  manualState = null;
  closeSheet();
  render();
  toast('已補登 ' + item.name + '，人力 ' + (mins[0] + mins[3]) + ' 分，待確認');
  sync(true);
}

/* ---- 品項管理 ------------------------------------------------------ */

var itemDraft = { name: '', unit: '盒' };

function openItems() {
  itemDraft = { name: '', unit: '盒' };
  renderItemsSheet();
}

function renderItemsSheet() {
  var list = liveItems();
  var rows = list.map(function (it, i) {
    return '<li>' +

      '</span></li>';
  }).join('');

  sheetHtml(
    '<h2>品項管理</h2>' +
    '<p class="hint">改名不會換品項編號，舊紀錄留的是當時的名稱快照，不會跟著變。</p>' +
    (rows ? '<ul class="tm-list">' + rows + '</ul>' : '<p class="tm-empty">還沒有品項。在下面新增第一個。</p>') +

    '<div class="tm-fieldlabel">預設單位</div>' +

    }).join('') + '</div>' +
    '<div class="tm-sheetfoot">' +
      '<button class="tm-btn" type="button" data-act="close">關閉</button>' +
      '<button class="tm-btn primary" type="button" data-act="item-add">＋ 新增</button>' +

  );
}

function syncItem(it) {
  enqueue('items', {
    itemUuid: it.itemUuid,
    name: it.name,
    unit: it.unit || '',
    order: it.order || 0,
    deleted: !!it.deleted,
    updatedAt: isoLocal(new Date())
  }, '品項｜' + it.name);
}

function addItem() {
  var el = document.getElementById('newItemName');
  var name = trimText(el ? el.value : '');
  if (!name) { toast('先輸入品項名稱'); return; }
  var dup = liveItems().some(function (x) { return x.name === name; });
  if (dup && !window.confirm('已經有一個叫「' + name + '」的品項，還是要再加一個嗎？')) return;
  var maxOrder = S.items.reduce(function (m, x) { return Math.max(m, x.order || 0); }, 0);
  var it = { itemUuid: uuid(), name: name, unit: itemDraft.unit, order: maxOrder + 1, deleted: false };
  S.items.push(it);
  saveItems();
  syncItem(it);
  itemDraft.name = '';
  renderItemsSheet();
  render();
  sync(true);
}

function renameItem(id) {
  var it = findItem(id);
  if (!it) return;
  var name = trimText(window.prompt('新的名稱', it.name) || '');
  if (!name || name === it.name) return;
  it.name = name;
  saveItems();
  syncItem(it);
  renderItemsSheet();
  render();
  sync(true);
}

function deleteItem(id) {
  var it = findItem(id);
  if (!it) return;
  var inUse = S.cards.some(function (c) { return c.itemUuid === id; });
  var msg = inUse
    ? '「' + it.name + '」還有進行中的卡片。刪掉品項不會影響那些卡片，確定刪嗎？'
    : '確定刪掉「' + it.name + '」？舊紀錄不受影響。';
  if (!window.confirm(msg)) return;
  it.deleted = true;
  saveItems();
  syncItem(it);
  renderItemsSheet();
  render();
  sync(true);
}

function moveItem(id, dir) {
  var list = liveItems();
  var i = -1;
  for (var k = 0; k < list.length; k++) if (list[k].itemUuid === id) { i = k; break; }
  var j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  var a = list[i], b = list[j];
  var tmp = a.order; a.order = b.order; b.order = tmp;
  saveItems();
  syncItem(a);
  syncItem(b);
  renderItemsSheet();
  render();
  sync(true);
}

function openChannels() {

}

function renderChannelsSheet() {

function syncChannel(ch) {

  }, '通路｜' + ch.name);

/** 新增一個通路並排進備份佇列。回傳新的通路物件 */
function createChannel(name, order) {
  var ch = { channelUuid: uuid(), name: name, order: order, deleted: false };

  syncChannel(ch);
  return ch;
}

function addChannel() {

function renameChannel(id) {

}

function deleteChannel(id) {

  syncChannel(ch);

function moveChannel(id, dir) {

  for (var k = 0; k < list.length; k++) if (list[k].channelUuid === id) { i = k; break; }
  var j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  var a = list[i], b = list[j];
  var tmp = a.order; a.order = b.order; b.order = tmp;
  saveChannels();
  syncChannel(a);
  syncChannel(b);
  renderChannelsSheet();

/**
 * 第一次使用時把「團購／自售」建起來，不然更新完打開會發現沒得選。
 * 用旗標記住「已經種過了」——沒有這個旗標的話，自己把通路全刪掉後
 * 下次開頁又會長回來，等於刪不掉。
 */
function seedDefaultChannels() {
  if (load(K.channelsSeeded, false)) return 0;
  save(K.channelsSeeded, true);
  if (liveChannels().length > 0) return 0;
  DEFAULT_CHANNELS.forEach(function (name, i) { createChannel(name, i + 1); });
  saveChannels();
  return DEFAULT_CHANNELS.length;
}

/* ---- 待確認清單與更正流程 ------------------------------------------ */

function openQueue() {
  renderQueueSheet();
}

function queueRowHtml(q) {
  var badge = q.state === 'confirmed'
    ? '<span class="tm-badge ok">已同步</span>'
    : (q.state === 'stuck'
      ? '<span class="tm-badge bad">送不出去</span>'
      : '<span class="tm-badge wait">待確認</span>');
  var voided = q.data && q.data.status === '已作廢';
  if (voided) badge += ' <span class="tm-badge void">已作廢</span>';

  var sub;
  if (q.type === 'production') {
    var pm = Number(q.data.pauseMin) || 0;
    sub = fmtClock(q.data.start) + '→' + fmtClock(q.data.packEnd) + '｜' + q.data.qty + (q.data.unit || '') +
      '｜人力 ' + laborMin(q.data) + ' 分' + (pm > 0 ? '（已扣暫停 ' + pm + ' 分）' : '') +
      '、冷卻 ' + coolMin(q.data) + ' 分';
  } else {
    var mins = Math.round((new Date(q.data.end) - new Date(q.data.start)) / 60000);
    var am = Number(q.data.assistMin) || 0;
    sub = fmtClock(q.data.start) + '→' + fmtClock(q.data.end) + '｜' + mins + ' 分' +
      (am > 0 ? '＋協助 ' + am + ' 分' : '') + '｜' +
      q.data.orderCount + ' 筆 / ' + q.data.boxCount + ' 盒';
  }

  var ops = '';
  if (!voided) {
    if (q.state === 'stuck') {
      ops += '<button type="button" data-act="q-retry" data-qid="' + esc(q.qid) + '">再試一次</button>';
    }
    if (q.state === 'pending' || q.state === 'stuck') {
      ops += '<button type="button" data-act="q-edit" data-qid="' + esc(q.qid) + '">修改</button>';
    }
    ops += '<button type="button" data-act="q-void" data-qid="' + esc(q.qid) + '" class="danger">作廢</button>';
  }

  return '<li>' +
    '<span class="name">' + esc(q.label || (q.type === 'production' ? '生產' : '出貨')) + '</span>' + badge +
    '<span class="ops">' + ops + '</span>' +
    '<span class="sub">' + esc(sub) + '（修訂 ' + q.rev + '）</span>' +
    '</li>';
}

/** 人力毛時間：還沒扣暫停的那個數字。後端擋「暫停 > 毛時間」也是拿這個比 */
function laborGrossMin(d) {
  var a = (new Date(d.ovenIn) - new Date(d.start)) / 60000;
  var b = (new Date(d.packEnd) - new Date(d.packStart)) / 60000;
  return Math.round((a + b) * 10) / 10;
}
function laborMin(d) {
  return Math.round((laborGrossMin(d) - (Number(d.pauseMin) || 0)) * 10) / 10;
}
function coolMin(d) {
  return Math.round(((new Date(d.packStart) - new Date(d.ovenOut)) / 60000) * 10) / 10;
}

/* ---- 今日小結與未結束提醒 ------------------------------------------ */

/**
 * 小結是這支手機的本機視窗，不是從試算表回查的完整日報。
 * 這樣剛完成、尚待查核的紀錄也會立即出現；真正的跨裝置總表仍在試算表。
 */
function recordCompletedAt(q) {
  if (!q || !q.data) return null;
  return q.type === 'production' ? q.data.packEnd : (q.type === 'shipping' ? q.data.end : null);
}
function isVoidedRecord(q) { return !!(q && q.data && q.data.status === '已作廢'); }
function todayRecords() {
  var today = localDateKey(new Date());
  return S.queue.filter(function (q) {
    var finishedAt = recordCompletedAt(q);
    return (q.type === 'production' || q.type === 'shipping') && !isVoidedRecord(q) &&
      finishedAt && localDateKey(new Date(finishedAt)) === today;
  });
}
function fmtSummaryMin(n) {
  var v = Math.round((Number(n) || 0) * 10) / 10;
  return (v % 1 === 0 ? String(v.toFixed(0)) : String(v)) + ' 分';
}
function cardAttentionLabel(c) {
  if (c.stage >= TIME_KEYS.length) return '已包裝完，待填數量';
  if (isPaused(c)) return '昨天開始，目前已暫停';
  return '昨天開始，現在在' + STAGE_STATUS[Math.min(c.stage, STAGE_STATUS.length - 1)];
}
function attentionCards() {
  var today = localDateKey(new Date());
  return S.cards.filter(function (c) {
    return c.stage >= TIME_KEYS.length ||
      (c.times.start && localDateKey(new Date(c.times.start)) !== today);
  }).sort(function (a, b) {
    var aDone = a.stage >= TIME_KEYS.length ? 0 : 1;
    var bDone = b.stage >= TIME_KEYS.length ? 0 : 1;
    return aDone - bDone;
  });
}
function renderDailyOverview() {
  var records = todayRecords();
  var prod = records.filter(function (q) { return q.type === 'production'; });
  var ship = records.filter(function (q) { return q.type === 'shipping'; });
  var labor = prod.reduce(function (sum, q) { return sum + laborMin(q.data); }, 0);
  var oven = prod.reduce(function (sum, q) {
    return sum + Math.max(0, (new Date(q.data.ovenOut) - new Date(q.data.ovenIn)) / 60000);
  }, 0);
  var shipMin = ship.reduce(function (sum, q) {
    return sum + Math.max(0, (new Date(q.data.end) - new Date(q.data.start)) / 60000);
  }, 0);
  var itemTotals = {};
  prod.forEach(function (q) {
    var d = q.data;
    var key = String(d.itemName || '未命名品項') + '|' + String(d.unit || '份');
    if (!itemTotals[key]) itemTotals[key] = { name: d.itemName || '未命名品項', unit: d.unit || '份', qty: 0 };
    itemTotals[key].qty += Number(d.qty) || 0;
  });
  var items = Object.keys(itemTotals).map(function (key) {
    var it = itemTotals[key];
    return esc(it.name) + ' ' + esc(it.qty) + esc(it.unit);
  });
  var waiting = records.filter(function (q) { return q.state === 'pending'; }).length;
  var stuck = records.filter(function (q) { return q.state === 'stuck'; }).length;
  var summary = document.getElementById('dailySummary');
  summary.dataset.date = localDateKey(new Date());
  summary.innerHTML =
    '<div class="tm-dailyhead"><h2>今天已記</h2><span class="tm-dailycount">生產 ' + prod.length + ' 筆・出貨 ' + ship.length + ' 趟</span></div>' +
    (records.length
      ? '<p class="tm-dailytime">人力 ' + fmtSummaryMin(labor) + '・烤箱 ' + fmtSummaryMin(oven) + '・出貨 ' + fmtSummaryMin(shipMin) + '</p>' +
        (items.length ? '<p class="tm-dailyitems">' + items.join('、') + '</p>' : '') +
        '<p class="tm-dailynote">這支手機今天已記' +
          (waiting ? '，含 ' + waiting + ' 筆待確認' : '') +
          (stuck ? (waiting ? '；' : '，') + '另有 ' + stuck + ' 筆送不出去' : '') +
          (!waiting && !stuck ? '，目前都已同步' : '') + '</p>'
      : '<p class="tm-dailynote">今天還沒有完成紀錄。完成後會自動顯示在這裡。</p>');

  var cards = attentionCards();
  var alert = document.getElementById('unfinishedAlert');
  alert.hidden = cards.length === 0;
  if (!cards.length) { alert.innerHTML = ''; return; }
  alert.innerHTML =
    '<h2>有 ' + cards.length + ' 張卡還沒收尾</h2>' +
    '<p>不會自動改時間；先確認是不是還在進行，或是忘了填數量。</p>' +
    '<div class="tm-carrylist">' + cards.map(function (c) {
      var elapsed = c.times.start ? fmtSpan(Date.now() - new Date(c.times.start).getTime()) : '尚未開始';
      return '<div class="tm-carryrow"><span class="name">' + esc(c.itemName) +
        (c.batchNote ? ' ' + esc(c.batchNote) : '') + '</span><span class="meta">' + esc(cardAttentionLabel(c)) + '・<span data-attention-elapsed="' + esc(c.id) + '">' + esc(elapsed) +
        '</span><button type="button" data-act="focus-card" data-id="' + esc(c.id) + '">查看</button></div>';
    }).join('') + '</div>';
}
function focusCard(id) {
  S.tab = 'prod';
  render();
  window.setTimeout(function () {
    var card = document.querySelector('.tm-card[data-id="' + id + '"]');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 0);
}

function renderQueueSheet() {
  var recs = S.queue.filter(function (q) { return q.type !== 'items'; })
    .sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
  var pending = recs.filter(function (q) { return q.state === 'pending'; });
  var confirmed = recs.filter(function (q) { return q.state === 'confirmed'; });
  var stuck = recs.filter(function (q) { return q.state === 'stuck'; });

  sheetHtml(
    '<h2>紀錄與更正</h2>' +
    '<p class="hint">送出後一律先標「待確認」，要等查核到試算表真的有那一列，才會翻成「已同步」。' +
    '已同步的不能直接改值，只能作廢再補一筆——否則你以為改了，試算表其實沒動。</p>' +
    (stuck.length
      ? '<div class="tm-fieldlabel">送不出去（' + stuck.length + '）</div>' +
        '<p class="tm-why">這幾筆送出去了，但試算表上一直查不到，很可能被後端擋下來——' +
        '常見原因是時間順序不合理、數量超出範圍、或名稱備註太長。' +
        '已經停止自動重送，免得一直白打。修改內容後會自動重送，或直接作廢。</p>' +
        '<ul class="tm-list">' + stuck.map(queueRowHtml).join('') + '</ul>'
      : '') +
    '<div class="tm-fieldlabel">待確認（' + pending.length + '）</div>' +
    (pending.length ? '<ul class="tm-list">' + pending.map(queueRowHtml).join('') + '</ul>' : '<p class="tm-empty">沒有待確認的紀錄。</p>') +
    '<div class="tm-fieldlabel">已同步（近 ' + KEEP_CONFIRMED_DAYS + ' 天，' + confirmed.length + '）</div>' +
    (confirmed.length ? '<ul class="tm-list">' + confirmed.map(queueRowHtml).join('') + '</ul>' : '<p class="tm-empty">還沒有查核成功的紀錄。</p>') +
    '<div class="tm-sheetfoot">' +
      '<button class="tm-btn" type="button" data-act="close">關閉</button>' +
      '<button class="tm-btn primary" type="button" data-act="q-sync">立即同步</button>' +
    '</div>'
  );
}

function findQ(qid) {
  for (var i = 0; i < S.queue.length; i++) if (S.queue[i].qid === qid) return S.queue[i];
  return null;
}

var editState = null;

function openEdit(qid) {
  var q = findQ(qid);
  if (!q) return;
  if (q.state === 'confirmed') { toast('已同步的紀錄不能直接改，請用「作廢」再補一筆'); return; }
  editState = { qid: qid };
  renderEditSheet();
}

/** 送不出去的那幾筆，使用者自己判斷沒問題時可以再推一次 */
function retryRecord(qid) {
  var q = findQ(qid);
  if (!q) return;
  q.miss = 0;
  q.state = 'pending';
  q.updatedAt = isoLocal(new Date());
  saveQueue();
  renderQueueSheet();
  render();
  toast('重新送一次');
  sync(true);
}

function renderEditSheet() {
  var q = findQ(editState.qid);
  if (!q) { closeSheet(); return; }
  var d = q.data;
  var body;
  if (q.type === 'production') {
    body =
      '<div class="tm-fieldlabel">產出數量（' + esc(d.unit || '份') + '）</div>' +
      '<input class="tm-input" id="edQty" type="number" inputmode="numeric" min="0" max="' + LIMITS.maxQty + '" value="' + d.qty + '">' +
      '<div class="tm-fieldlabel">暫停分鐘（人力會扣掉這些；這段的實際工作時間是 ' + laborGrossMin(d) + ' 分）</div>' +
      '<input class="tm-input" id="edPause" type="number" inputmode="numeric" min="0" value="' + esc(Number(d.pauseMin) || 0) + '">' +
      '<div class="tm-fieldlabel">批次備註</div>' +
      '<input class="tm-input" id="edBatch" type="text" maxlength="' + LIMITS.text + '" value="' + esc(d.batchNote || '') + '">';
  } else {
    body =
      '<div class="tm-fieldlabel">訂單筆數</div>' +
      '<input class="tm-input" id="edOrd" type="number" inputmode="numeric" min="0" max="' + LIMITS.maxOrderCount + '" value="' + d.orderCount + '">' +
      '<div class="tm-fieldlabel">總盒數</div>' +
      '<input class="tm-input" id="edBox" type="number" inputmode="numeric" min="0" max="' + LIMITS.maxBoxCount + '" value="' + d.boxCount + '">' +
      '<div class="tm-fieldlabel">協助分鐘（沒有就填 0）</div>' +
      '<input class="tm-input" id="edAssist" type="number" inputmode="numeric" min="0" value="' + esc(Number(d.assistMin) || 0) + '">';
  }
  sheetHtml(
    '<h2>修改待確認的紀錄</h2>' +
    '<p class="hint">' + esc(q.label) + '｜同一筆重送，修訂序號會從 ' + q.rev + ' 變成 ' + (q.rev + 1) + '。時間點不開放修改，要改時間請作廢後重記一次。</p>' +
    body +
    '<div class="tm-fieldlabel">備註</div>' +
    '<input class="tm-input" id="edNote" type="text" maxlength="' + LIMITS.text + '" value="' + esc(d.note || '') + '">' +
    '<div class="tm-sheetfoot">' +
      '<button class="tm-btn" type="button" data-act="q-back">↩ 回列表</button>' +
      '<button class="tm-btn primary" type="button" data-act="q-save">存起來重送</button>' +
    '</div>'
  );
}

function commitEdit() {
  var q = findQ(editState.qid);
  if (!q) { closeSheet(); return; }
  var d = JSON.parse(JSON.stringify(q.data));
  if (q.type === 'production') {
    var qty = Math.round(Number(document.getElementById('edQty').value));
    if (isNaN(qty) || qty < 0 || qty > LIMITS.maxQty) { toast('數量要在 0～' + LIMITS.maxQty + ' 之間'); return; }
    var pause = Number(document.getElementById('edPause').value);
    if (isNaN(pause) || pause < 0) { toast('暫停分鐘要是 0 以上的數字'); return; }
    if (pause > laborGrossMin(d)) { toast('暫停不能比實際工作的 ' + laborGrossMin(d) + ' 分還久，後端會擋下來'); return; }
    d.qty = qty;
    d.pauseMin = Math.round(pause * 10) / 10;
    d.batchNote = trimText(document.getElementById('edBatch').value);
  } else {
    var ord = Math.round(Number(document.getElementById('edOrd').value));
    var box = Math.round(Number(document.getElementById('edBox').value));
    var assist = Number(document.getElementById('edAssist').value);
    if (isNaN(ord) || ord < 0 || ord > LIMITS.maxOrderCount) { toast('訂單筆數超出範圍'); return; }
    if (isNaN(box) || box < 0 || box > LIMITS.maxBoxCount) { toast('總盒數超出範圍'); return; }
    if (isNaN(assist) || assist < 0 || assist > LIMITS.maxAssistMin) { toast('協助分鐘超出範圍'); return; }
    d.orderCount = ord;
    d.boxCount = box;
    d.assistMin = Math.round(assist * 10) / 10;
  }
  d.note = trimText(document.getElementById('edNote').value);
  d.rev = q.rev + 1;
  enqueue(q.type, d, q.label);
  editState = null;
  renderQueueSheet();
  render();
  toast('已改好，重新送出中');
  sync(true);
}

function voidRecord(qid) {
  var q = findQ(qid);
  if (!q) return;
  var wasConfirmed = q.state === 'confirmed';
  var msg = wasConfirmed
    ? '這筆已經寫進試算表了。作廢會把那一列標成「已作廢」（修訂 ' + (q.rev + 1) + '），不會刪掉。要繼續嗎？'
    : '要把這筆標成已作廢嗎？';
  if (!window.confirm(msg)) return;
  var d = JSON.parse(JSON.stringify(q.data));
  d.status = '已作廢';
  d.rev = q.rev + 1;
  enqueue(q.type, d, q.label);
  renderQueueSheet();
  render();
  toast('已標為作廢，送出中');
  sync(true);
}

function restoreItems(silent) {
  if (!navigator.onLine) {
    if (!silent) toast('目前離線，還原需要連線');
    return Promise.resolve(0);
  }
  if (!silent) toast('還原中…');
  return jsonp({ action: 'items' }).then(function (res) {
    if (!res || !res.ok || !Array.isArray(res.items)) {
      if (!silent) toast('還原失敗：後端沒有回品項');
      return 0;
    }
    autoRestoreDone = true;
    var added = 0;
    res.items.forEach(function (r) {
      if (!r || !r.itemUuid) return;
      if (findItem(r.itemUuid)) return;
      S.items.push({ itemUuid: r.itemUuid, name: r.name, unit: r.unit || '', order: Number(r.order) || 0, deleted: false });
      added++;
    });
    if (added > 0) { saveItems(); render(); toast('從試算表還原了 ' + added + ' 個品項'); }
    else if (!silent) toast('沒有需要還原的品項');
    return added;
  }).catch(function (e) {
    if (!silent) toast('還原失敗：' + (e && e.message ? e.message : '連線問題'));
    return 0;
  });
}

/**
 * 本機品項清單是空的就自動從試算表還原一次，不必使用者自己去設定裡按。
 *
 * 為什麼會空：iOS 從主畫面圖示打開的 App，儲存空間跟 Safari 是**分開的兩份**。
 * 在 Safari 裡建好品項、加到主畫面、再從圖示打開，看到的會是一份全新的空清單。
 * 換手機、清瀏覽器資料也一樣。試算表那張備份就是為了這種時候存在的。
 *
 * 只在「本機一個品項都沒有」時才動作 —— 有東西就不碰，
 * 免得變成沒說要做的跨裝置雙向合併，把手動刪掉的品項又復活。
 */
var autoRestoreDone = false;
function maybeAutoRestoreItems() {
  if (autoRestoreDone) return;
  if (liveItems().length > 0) { autoRestoreDone = true; return; }
  if (!navigator.onLine) return;   // 離線就先算了，連上網路時會再試一次
  restoreItems(true);
}

/**
 * 通路還原。跟品項的差別是「同名的就不再加一次」——
 * 離線第一次使用時會先自己種出團購／自售，之後連上網路還原到試算表上的同名通路，
 * 沒有這道去重就會變成畫面上兩顆「團購」。
 */
function restoreChannels(silent) {
  if (!navigator.onLine) {
    if (!silent) toast('目前離線，還原需要連線');
    return Promise.resolve(0);
  }
  if (!silent) toast('還原中…');
  return jsonp({ action: 'channels' }).then(function (res) {
    if (!res || !res.ok || !Array.isArray(res.channels)) {
      if (!silent) toast('還原失敗：後端沒有回通路');
      return 0;
    }
    channelInitDone = true;
    var names = {};
    liveChannels().forEach(function (c) { names[c.name] = true; });
    var added = 0;
    res.channels.forEach(function (r) {
      if (!r || !r.channelUuid) return;
      if (findChannel(r.channelUuid) || names[r.name]) return;
      S.channels.push({ channelUuid: r.channelUuid, name: r.name, order: Number(r.order) || 0, deleted: false });
      names[r.name] = true;
      added++;
    });
    if (added > 0) { saveChannels(); render(); toast('從試算表還原了 ' + added + ' 個通路'); }
    else if (!silent) toast('沒有需要還原的通路');
    return added;
  }).catch(function (e) {
    if (!silent) toast('還原失敗：' + (e && e.message ? e.message : '連線問題'));
    return 0;
  });
}

/**
 * 通路的開機準備：本機有就什麼都不做；沒有的話先去試算表撈，
 * 撈不到（或離線）才自己種預設的兩個。順序刻意是「先撈再種」，
 * 反過來會在換手機時把試算表上既有的通路變成重複的一份。
 */
var channelInitDone = false;
function maybeInitChannels() {
  if (channelInitDone) return;
  if (liveChannels().length > 0) { channelInitDone = true; return; }
  if (!navigator.onLine) {
    // 離線也要能出貨，先種預設值；之後連上網路還原時會用名稱去重
    if (seedDefaultChannels() > 0) render();
    return;
  }
  restoreChannels(true).then(function (added) {
    if (added === 0 && liveChannels().length === 0) {
      if (seedDefaultChannels() > 0) { render(); sync(true); }
    }
  });
}

function pingBackend() {
  if (!navigator.onLine) { toast('目前離線'); return; }
  toast('測試中…');
  jsonp({ action: 'ping' }, 15000).then(function (res) {
    toast(res && res.ok ? '連得上，後端有回應' : '連上了，但回應不正常');
  }).catch(function (e) { toast('連不上：' + (e && e.message ? e.message : '連線問題')); });
}

var modal = document.getElementById('modal');
